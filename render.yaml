services:
  - type: web
    name: ai-video-assistant-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: ai_video_assistant
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROK_BASE_URL
        value: https://api.x.ai/v1
      - key: GROK_MODEL
        value: grok-beta
